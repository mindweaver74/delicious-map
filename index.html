<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회식 깨동여지도</title>
<style>
  :root{
    --paper:#EDE2C9;
    --paper-2:#E2D4AE;
    --paper-3:#D9C99A;
    --ink:#2B2318;
    --ink-soft:#5C4E3A;
    --seal:#A13D2B;
    --seal-dark:#7C2E20;
    --line: rgba(43,35,24,0.28);
    --line-soft: rgba(43,35,24,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.35), transparent 55%),
      radial-gradient(ellipse at 90% 90%, rgba(0,0,0,0.06), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'Malgun Gothic', '맑은 고딕', sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  .texture-line{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(43,35,24,0.02) 0px, rgba(43,35,24,0.02) 1px, transparent 1px, transparent 3px);
    opacity:0.5;
  }
  header{
    position:relative; z-index:1;
    padding:34px 20px 22px;
    text-align:center;
    border-bottom:3px double var(--ink);
  }
  header .eyebrow{
    font-size:12px; letter-spacing:0.15em; color:var(--seal);
    font-weight:700; margin-bottom:6px;
  }
  header h1{
    font-family:'궁서', Batang, serif;
    font-weight:900;
    font-size:34px;
    margin:0 0 8px;
    letter-spacing:0.02em;
  }
  header p{
    margin:0; color:var(--ink-soft); font-size:13.5px;
  }
  .stamp{
    display:inline-block; margin-top:14px;
    border:2px solid var(--seal); color:var(--seal);
    font-family:'궁서', Batang, serif; font-weight:700;
    font-size:12px; padding:4px 12px; border-radius:3px;
    transform:rotate(-3deg);
  }

  main{ position:relative; z-index:1; max-width:900px; margin:0 auto; padding:24px 16px 0; }

  section.map-section{ margin-bottom:26px; }
  .section-title{
    font-family:'궁서', Batang, serif; font-weight:700; font-size:16px;
    margin:0 0 4px;
  }
  .section-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; }

  .zone-map{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 14px;
    display:flex; flex-wrap:wrap; gap:10px;
    justify-content:center;
    box-shadow: inset 0 0 30px rgba(43,35,24,0.06);
  }
  .zone-btn{
    position:relative;
    border:1.5px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    font-family:'궁서', Batang, serif;
    font-weight:700;
    font-size:14px;
    padding:10px 16px 10px 14px;
    border-radius:999px 999px 999px 4px;
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease;
    display:flex; align-items:center; gap:8px;
  }
  .zone-btn:nth-child(2n){ transform:rotate(-1.4deg); }
  .zone-btn:nth-child(3n){ transform:rotate(1.6deg); }
  .zone-btn:nth-child(5n){ transform:rotate(-0.8deg); }
  .zone-btn:hover{ transform:scale(1.04) rotate(0deg); }
  .zone-btn.active{
    background:var(--seal); border-color:var(--seal-dark); color:var(--paper);
    transform:scale(1.06) rotate(0deg);
  }
  .zone-count{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; padding:0 5px;
    border-radius:50%;
    background:var(--seal); color:var(--paper);
    font-family:'Malgun Gothic', '맑은 고딕', sans-serif; font-size:11px; font-weight:700;
  }
  .zone-btn.active .zone-count{ background:var(--paper); color:var(--seal); }

  .seoul-map-wrap{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 10px 4px;
    margin-bottom:12px;
    box-shadow: inset 0 0 30px rgba(43,35,24,0.06);
  }
  .seoul-map-wrap svg{ width:100%; height:auto; display:block; }
  .zone-shape{
    fill:var(--paper);
    stroke:var(--ink);
    stroke-width:1.4;
    cursor:pointer;
    transition:fill .15s ease;
  }
  .zone-shape:hover{ fill:#fff8ea; }
  .zone-shape.active{ fill:var(--seal); fill-opacity:0.18; stroke:var(--seal-dark); stroke-width:2; }
  .zone-label{
    font-family:'궁서', Batang, serif; font-weight:700;
    fill:var(--ink); pointer-events:none; user-select:none;
  }
  .zone-pin-hit{ cursor:pointer; fill:transparent; }
  .zone-pin-dot{ fill:var(--seal); stroke:var(--paper); stroke-width:1.6; pointer-events:none; }
  .zone-pin-dot.active{ fill:var(--seal-dark); }
  .zone-pin-count{
    font-family:'Malgun Gothic', '맑은 고딕', sans-serif; font-weight:700; font-size:9px;
    fill:var(--paper); pointer-events:none; text-anchor:middle; dominant-baseline:central;
  }
  .river-path{ fill:none; stroke:#8FA9AE; stroke-width:9; opacity:0.55; stroke-linecap:round; }
  .river-path2{ fill:none; stroke:#fff; stroke-width:1; opacity:0.35; stroke-dasharray:2 5; }
  .map-caption{ text-align:center; font-size:11px; color:var(--ink-soft); padding:6px 4px 10px; }

  .filters{
    margin-top:14px;
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .filters input[type=text]{
    flex:1 1 160px;
    font-family:'Malgun Gothic', '맑은 고딕', sans-serif;
    font-size:13px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff8ea;
    color:var(--ink);
  }
  .filters select{
    flex:1 1 100px;
    font-family:'Malgun Gothic', '맑은 고딕', sans-serif;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff8ea;
    color:var(--ink);
  }
  .filters input::placeholder{ color:#9c8c6f; }

  .result-bar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:20px 2px 10px;
  }
  .result-bar .count{ font-family:'궁서', Batang, serif; font-weight:700; font-size:15px; }
  .result-bar .count b{ color:var(--seal); font-size:19px; }
  .reset-link{
    font-size:12.5px; color:var(--ink-soft); text-decoration:underline;
    cursor:pointer; background:none; border:none; font-family:inherit;
    padding:0;
  }

  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 12px 11px;
    cursor:pointer;
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    position:relative;
  }
  .card:hover{
    box-shadow:0 4px 14px rgba(43,35,24,0.15);
    transform:translateY(-2px);
    border-color:var(--seal);
  }
  .card .c-region{
    font-size:10.5px; color:var(--seal); font-weight:700; letter-spacing:0.02em;
    margin-bottom:4px;
  }
  .card .c-name{
    font-family:'궁서', Batang, serif; font-weight:700; font-size:15px;
    margin-bottom:6px; line-height:1.3;
  }
  .card .c-type{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .card .c-meta{
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .tag{
    font-size:10.5px; padding:2px 7px; border-radius:999px;
    border:1px solid var(--line); color:var(--ink-soft);
    background:rgba(255,255,255,0.5);
    white-space:nowrap;
  }
  .tag.room-y{ border-color:var(--seal); color:var(--seal); }

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
    font-size:13.5px;
  }
  .empty-state .big{ font-family:'궁서', Batang, serif; font-size:20px; color:var(--ink); margin-bottom:8px; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,15,8,0.55);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--paper);
    width:100%; max-width:560px;
    border-radius:20px 20px 0 0;
    border-top:3px double var(--ink);
    max-height:86vh; overflow-y:auto;
    padding:22px 22px 30px;
    animation:slideUp .22s ease;
    position:relative;
  }
  @media (min-width:600px){
    .overlay{ align-items:center; }
    .sheet{ border-radius:16px; border:3px double var(--ink); max-height:80vh; }
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet .close-btn{
    position:absolute; top:16px; right:18px;
    background:none; border:none; font-size:20px; color:var(--ink-soft);
    cursor:pointer; line-height:1;
  }
  .sheet .s-region{ font-size:12px; color:var(--seal); font-weight:700; margin-bottom:6px; }
  .sheet h2{ font-family:'궁서', Batang, serif; font-size:22px; margin:0 0 4px; padding-right:24px; }
  .sheet .s-type{ font-size:13px; color:var(--ink-soft); margin-bottom:16px; }
  .info-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:16px;
  }
  .info-box{
    background:var(--paper-2); border:1px solid var(--line-soft); border-radius:8px;
    padding:9px 12px;
  }
  .info-box .lbl{ font-size:10.5px; color:var(--ink-soft); margin-bottom:2px; }
  .info-box .val{ font-size:13.5px; font-weight:700; }
  .sheet .block{ margin-bottom:14px; }
  .sheet .block .lbl{ font-size:11.5px; color:var(--seal); font-weight:700; margin-bottom:4px; }
  .sheet .block .txt{ font-size:13.5px; line-height:1.6; }
  .addr-link{ color:var(--ink); text-decoration:none; }
  .addr-link:hover{ text-decoration:underline; }
  .addr-pin{
    display:inline-block; margin-left:2px;
    font-size:11.5px; font-weight:700; color:var(--seal);
    white-space:nowrap;
  }
  .sheet .divider{ border:none; border-top:1px dashed var(--line); margin:16px 0; }

  footer{
    text-align:center; padding:26px 20px 6px; color:var(--ink-soft); font-size:11.5px;
    position:relative; z-index:1;
  }
</style>
</head>
<body>
<div class="texture-line"></div>

<header>
  <div class="eyebrow">기업문화 CHANGER</div>
  <h1>회식 깨동여지도</h1>
  <p>사람들이 다녀온 회식 맛집, 지역별로 모아봤습니다</p>
  <div class="stamp" id="totalCountStamp">수록 중</div>
</header>

<main>

  <section class="map-section">
    <p class="section-title">지역으로 찾기</p>
    <p class="section-sub">지도에서 권역을 짚으면 그 지역 맛집만 모아보여드려요</p>
    <div class="seoul-map-wrap">
      <div id="seoulMap"></div>
      <div class="map-caption">※ 실제 주소 좌표가 아닌, 권역별 대략적인 위치입니다</div>
    </div>
    <div class="zone-map" id="zoneMap"></div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="식당 이름, 메뉴로 검색">
      <select id="typeSelect"><option value="">종류 전체</option></select>
      <select id="capSelect">
        <option value="">인원 전체</option>
        <option value="10">10명 이상</option>
        <option value="20">20명 이상</option>
        <option value="40">40명 이상</option>
        <option value="80">80명 이상</option>
      </select>
      <select id="roomSelect">
        <option value="">룸 전체</option>
        <option value="O">룸 있음</option>
      </select>
    </div>
  </section>

  <div class="result-bar">
    <div class="count"><b id="resultCount">0</b>곳</div>
    <button class="reset-link" id="resetBtn">필터 초기화</button>
  </div>

  <div class="card-grid" id="cardGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">해당하는 곳이 없어요</div>
    검색어나 필터 조건을 조금 넓혀보세요
  </div>

</main>

<footer>사내 회식 참고용 · 정보가 실제와 다를 수 있으니 방문 전 전화 확인을 권장합니다</footer>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

const ZONE_META = {
  yeouido:  {label:"여의도", short:"여의도"},
  mapo:     {label:"마포·공덕", short:"마포"},
  gangnam:  {label:"강남·서초·선릉", short:"강남"},
  downtown: {label:"도심(종로·을지로·광화문)", short:"도심"},
  yongsan:  {label:"용산", short:"용산"},
  etcseoul: {label:"서울 기타", short:"서울기타"},
  region:   {label:"지방", short:"지방"}
};

let state = { zone:"", search:"", type:"", cap:"", room:"" };

// 서울 권역을 대략적인 상대 위치로 배치한 손그림풍 지도 좌표
// path는 각 권역을 뭉뚝한 땅덩어리 모양으로 표현하기 위한 좌표
const SEOUL_SHAPES = {
  mapo:     { path:"M18,86 C10,70 30,55 55,52 C82,49 108,58 112,80 C116,102 98,118 70,120 C42,122 24,104 18,86 Z", pin:{x:60,y:86},  labelPos:{x:38,y:66} },
  downtown: { path:"M128,30 C122,14 150,4 182,6 C214,8 238,20 234,40 C230,60 198,68 168,64 C138,60 134,46 128,30 Z", pin:{x:180,y:36}, labelPos:{x:150,y:20} },
  yongsan:  { path:"M150,96 C146,84 164,74 186,76 C206,78 218,90 214,104 C210,118 190,124 172,120 C154,116 154,108 150,96 Z", pin:{x:182,y:100}, labelPos:{x:158,y:132} },
  yeouido:  { path:"M62,130 C56,116 82,104 116,106 C150,108 168,120 164,136 C160,152 128,160 96,158 C64,156 68,144 62,130 Z", pin:{x:114,y:132}, labelPos:{x:80,y:150} },
  etcseoul: { path:"M226,50 C224,36 250,26 278,30 C304,34 314,48 306,62 C298,76 270,80 248,74 C226,68 228,64 226,50 Z", pin:{x:270,y:52},  labelPos:{x:236,y:88} },
  gangnam:  { path:"M182,146 C178,130 214,118 254,122 C292,126 314,144 306,164 C298,184 258,196 220,190 C182,184 186,162 182,146 Z", pin:{x:246,y:156}, labelPos:{x:200,y:200} }
};

function buildSeoulMap(){
  const el = document.getElementById('seoulMap');
  const counts = {};
  DATA.forEach(d=>{ counts[d.zone] = (counts[d.zone]||0)+1; });

  let shapesSvg = "";
  let pinsSvg = "";
  let labelsSvg = "";
  Object.keys(SEOUL_SHAPES).forEach(z=>{
    const s = SEOUL_SHAPES[z];
    const cnt = counts[z] || 0;
    if(cnt===0) return;
    const isActive = state.zone === z;
    shapesSvg += `<path class="zone-shape${isActive?' active':''}" data-zone="${z}" d="${s.path}"></path>`;
    labelsSvg += `<text class="zone-label" x="${s.labelPos.x}" y="${s.labelPos.y}" font-size="11">${ZONE_META[z].short}</text>`;
    const r = 11 + Math.min(cnt,50)*0.12;
    pinsSvg += `
      <g data-zone="${z}" style="cursor:pointer;">
        <circle class="zone-pin-dot${isActive?' active':''}" cx="${s.pin.x}" cy="${s.pin.y}" r="${r}"></circle>
        <text class="zone-pin-count" x="${s.pin.x}" y="${s.pin.y+1}">${cnt}</text>
        <circle class="zone-pin-hit" data-zone="${z}" cx="${s.pin.x}" cy="${s.pin.y}" r="${r+8}"></circle>
      </g>`;
  });

  el.innerHTML = `
    <svg viewBox="0 0 330 210" xmlns="http://www.w3.org/2000/svg">
      <path class="river-path" d="M0,108 C60,124 110,96 170,110 C230,124 280,100 330,112"></path>
      <path class="river-path2" d="M0,108 C60,124 110,96 170,110 C230,124 280,100 330,112"></path>
      ${shapesSvg}
      ${labelsSvg}
      ${pinsSvg}
    </svg>
  `;
  el.querySelectorAll('[data-zone]').forEach(node=>{
    node.style.pointerEvents = 'none';
  });
  const svgRoot = el.querySelector('svg');
  svgRoot.addEventListener('click', (e)=>{
    const target = e.target.closest('[data-zone]');
    if(!target) return;
    const z = target.getAttribute('data-zone');
    state.zone = (state.zone === z ? "" : z);
    render();
    document.getElementById('resultCount').scrollIntoView({behavior:'smooth', block:'center'});
  });
  el.querySelectorAll('.zone-shape, .zone-pin-hit').forEach(node=>{
    node.style.pointerEvents = 'auto';
  });
}

function buildZoneMap(){
  const wrap = document.getElementById('zoneMap');
  wrap.innerHTML = "";
  const allBtn = document.createElement('button');
  allBtn.className = 'zone-btn' + (state.zone===""?" active":"");
  allBtn.innerHTML = `전체 <span class="zone-count">${DATA.length}</span>`;
  allBtn.onclick = () => { state.zone=""; render(); };
  wrap.appendChild(allBtn);

  Object.keys(ZONE_META).forEach(z=>{
    const cnt = DATA.filter(d=>d.zone===z).length;
    if(cnt===0) return;
    const btn = document.createElement('button');
    btn.className = 'zone-btn' + (state.zone===z?" active":"");
    btn.innerHTML = `${ZONE_META[z].label} <span class="zone-count">${cnt}</span>`;
    btn.onclick = () => { state.zone = (state.zone===z? "" : z); render(); };
    wrap.appendChild(btn);
  });
}

function buildTypeOptions(){
  const sel = document.getElementById('typeSelect');
  const cats = {};
  DATA.forEach(d=>{
    const base = d.type.split('(')[0].trim();
    cats[base] = (cats[base]||0)+1;
  });
  Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = `${c} (${cats[c]})`;
    sel.appendChild(opt);
  });
}

function filteredData(){
  return DATA.filter(d=>{
    if(state.zone && d.zone!==state.zone) return false;
    if(state.type && !d.type.startsWith(state.type)) return false;
    if(state.cap && (d.cap===null || d.cap < Number(state.cap))) return false;
    if(state.room && d.room !== "O") return false;
    if(state.search){
      const q = state.search.toLowerCase();
      if(!(d.n.toLowerCase().includes(q) || d.type.toLowerCase().includes(q) || d.addr.toLowerCase().includes(q))) return false;
    }
    return true;
  });
}

function render(){
  document.getElementById('totalCountStamp').textContent = DATA.length + '곳 수록';
  buildSeoulMap();
  buildZoneMap();
  const list = filteredData();
  document.getElementById('resultCount').textContent = list.length;
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = "";
  if(list.length===0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    list.forEach(d=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openSheet(d);
      card.innerHTML = `
        <div class="c-region">${d.region}</div>
        <div class="c-name">${d.n}</div>
        <div class="c-type">${d.type}</div>
        <div class="c-meta">
          <span class="tag">${d.cap ? d.cap+'명' : '인원 문의'}</span>
          <span class="tag">${d.price}</span>
          <span class="tag ${d.room==='O'?'room-y':''}">룸 ${d.room==='O'?'있음':(d.room==='△'?'일부':'없음')}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }
}

function openSheet(d){
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <button class="close-btn" onclick="closeSheet()">✕</button>
    <div class="s-region">${d.region}</div>
    <h2>${d.n}</h2>
    <div class="s-type">${d.type}</div>
    <div class="info-grid">
      <div class="info-box"><div class="lbl">최대 인원</div><div class="val">${d.cap ? d.cap+'명' : '문의 필요'}</div></div>
      <div class="info-box"><div class="lbl">1인당 가격</div><div class="val">${d.price}</div></div>
      <div class="info-box"><div class="lbl">룸 보유</div><div class="val">${d.room==='O'?'있음':(d.room==='△'?'일부 가능':'없음')}</div></div>
      <div class="info-box"><div class="lbl">예약 가능</div><div class="val">${d.reserve==='O'?'가능':'불가'}</div></div>
    </div>
    <div class="block"><div class="lbl">주소</div><div class="txt"><a class="addr-link" href="https://map.kakao.com/link/search/${encodeURIComponent(d.addr)}" target="_blank" rel="noopener">${d.addr} <span class="addr-pin">📍 지도에서 보기</span></a></div></div>
    <div class="block"><div class="lbl">예약 방법</div><div class="txt">${d.channel}</div></div>
    <hr class="divider">
    <div class="block"><div class="lbl">참고 사항</div><div class="txt">${d.note}</div></div>
  `;
  document.getElementById('overlay').classList.add('open');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeSheet();
});

document.getElementById('searchInput').addEventListener('input', e=>{ state.search=e.target.value; render(); });
document.getElementById('typeSelect').addEventListener('change', e=>{ state.type=e.target.value; render(); });
document.getElementById('capSelect').addEventListener('change', e=>{ state.cap=e.target.value; render(); });
document.getElementById('roomSelect').addEventListener('change', e=>{ state.room=e.target.value; render(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  state = { zone:"", search:"", type:"", cap:"", room:"" };
  document.getElementById('searchInput').value="";
  document.getElementById('typeSelect').value="";
  document.getElementById('capSelect').value="";
  document.getElementById('roomSelect').value="";
  render();
});

buildTypeOptions();
render();
</script>
